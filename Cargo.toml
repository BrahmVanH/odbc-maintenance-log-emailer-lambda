[[bin]]
name = "lambda"
path = "src/lambda.rs"


[package]
name = "maintenance_sheet_emailer"
version = "0.1.0"
edition = "2021"  

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true


[dependencies]
aws-config = "1.1.7"
aws-sdk-ses = { version = "1.9.0", default-features = false, features = ["rustls"] }
aws-sdk-ssm = "1.12.0"
calamine = "0.31.0"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-humanize = "0.2.3"
dropbox-sdk = { version = "0.19.1" }
lambda_runtime = { version = "0.14.4" }
lettre = { version = "0.11.19", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname" ] }
opendal = { version = "0.54.1", features = ["services-dropbox"] }
sentry = { version = "0.45.0", default-features = false, features = ["reqwest", "rustls", "backtrace", "contexts", "panic"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }